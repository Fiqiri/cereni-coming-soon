    <meta name="description" content="Kthehemi së shpejti.">
    <title>Kthehemi së shpejti</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: 1.5rem;
        background: #fff;
        color: #171717;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 4.5rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.1;
      }

      <h1>Kthehemi së shpejti</h1>
